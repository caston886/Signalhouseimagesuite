name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    # Real .NET SDK + real NuGet access -- this is the environment that
    # actually compiles the project; it was written without either.
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed so the log-upload-on-failure step below can push

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create solution and add projects
        run: |
          dotnet new sln -n SignalHouseImagingSuite --force
          dotnet sln add src/SignalHouse.Core/SignalHouse.Core.csproj
          dotnet sln add src/SignalHouse.App/SignalHouse.App.csproj

      - name: Restore
        run: dotnet restore

      - name: Build
        id: build
        run: dotnet build --no-restore --configuration Release 2>&1 | tee build_output.txt

      # GitHub's raw job logs live behind a redirect to blob storage that
      # isn't reachable from where this workflow is being read back from, so
      # on failure the build output is committed straight into the repo
      # instead -- a plain git push stays on api.github.com/github.com,
      # which is reachable everywhere.
      - name: Record build log on failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ci-logs
          cp build_output.txt ci-logs/latest-build-log.txt
          git add ci-logs/latest-build-log.txt
          git commit -m "ci: record failing build log [skip ci]"
          git push

      # LibRaw's native binary is a runtime dependency, not a compile-time
      # one (see LibRawNative.cs / README.md) -- it is NOT required for this
      # build step to succeed. A green run here means the C#/XAML compiles
      # cleanly; it does not by itself confirm the LibRaw P/Invoke calls
      # succeed at runtime without that native binary in place.

