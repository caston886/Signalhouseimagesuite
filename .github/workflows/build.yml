name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    # Real .NET SDK + real NuGet access -- this is the environment that
    # actually compiles the project; it was written without either.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create solution and add projects
        run: |
          dotnet new sln -n SignalHouseImagingSuite --force
          dotnet sln add src/SignalHouse.Core/SignalHouse.Core.csproj
          dotnet sln add src/SignalHouse.App/SignalHouse.App.csproj

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # LibRaw's native binary is a runtime dependency, not a compile-time
      # one (see LibRawNative.cs / README.md) -- it is NOT required for this
      # build step to succeed. A green run here means the C#/XAML compiles
      # cleanly; it does not by itself confirm the LibRaw P/Invoke calls
      # succeed at runtime without that native binary in place.
